# ===========================================================================
# 4× RTX 3090 tensor-parallel variant — uses all GPUs on this box for big
# context.
#
# Strategy: copy the default fp8_e5m2 + vision + tools config but shard the
# model across 4 cards. Per-card KV budget grows ~4× (each card holds 1/4 of
# weights), so max-model-len can grow well past the single-card 20K cap.
# Configured at 500K — verified end-to-end with a 470K-token needle recall
# (475 s on a single request). KV pool comes out at 507,200 tokens at
# gpu-memory-utilization 0.95 + max-num-seqs 1; that's the practical ceiling
# for a single request. vLLM's pre-check accepts arbitrarily larger
# max-model-len because VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 is set, but a single
# prompt can't physically exceed the pool, so 500K is the honest cap.
#
# Trade-offs vs single-GPU `default`:
#   + ~4× KV memory budget → push max-model-len to 150K with vision still on
#   + Prefill scales (more compute available across cards)
#   + Genesis NOT required (fp8_e5m2 KV bypasses the hybrid-gate patch)
#   - Generation TPS often LOWER than TP=1 on consumer 3090s: no NVLink, all-
#     reduce traverses PCIe + host memory each layer (NCCL_P2P_DISABLE=1 is
#     required because P2P is unreliable on consumer cards). Expect roughly
#     30–50% of single-GPU decode TPS in steady state.
#   - Whole machine is committed; can't run other GPU work simultaneously.
#
# Use this when you need long context (50K–150K) on a single request and
# don't care about peak token rate. For interactive chat, the single-GPU
# default is faster; for full-repo / long-doc analysis, this scales.
#
# Run with:
#   cd compose
#   docker compose -f docker-compose.tp4.yml up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    image: vllm/vllm-openai@sha256:9b534fe66daf152e8ceca8a7f8e14c18105aaf6ddabc61eb17730d85b4c7c194
    container_name: vllm-qwen36-27b
    restart: "no"
    ports:
      - "8020:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
      - ../patches/templates/qwen3.6-enhanced.jinja:/patches/templates/qwen3.6-enhanced.jinja:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      # P2P is unreliable on consumer 3090s without NVLink — force NCCL through
      # host memory. Without this, multi-GPU runs hang or produce corrupted
      # output during the first all-reduce.
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    shm_size: "32gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        python3 /patches/patch_tolist_cudagraph.py || true
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - --served-model-name
      - qwen3.6-27b-autoround
      - --quantization
      - auto_round
      - --dtype
      - float16
      - --tensor-parallel-size
      - "4"
      - --max-model-len
      - "500000"
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4128"
      - --kv-cache-dtype
      - fp8_e5m2
      - --trust-remote-code
      - --chat-template
      - /patches/templates/qwen3.6-enhanced.jinja
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
