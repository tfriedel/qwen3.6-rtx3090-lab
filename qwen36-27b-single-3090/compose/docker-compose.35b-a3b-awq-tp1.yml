# ===========================================================================
# Qwen3.6-35B-A3B (MoE, 3B active) — AWQ-INT4 — single 3090.
#
# Tight fit: AWQ-INT4 weights ~20 GB on a 24 GB 3090 leaves ~3 GB for
# activations + KV. Uses --enforce-eager to skip CUDA graph capture (saves
# ~1 GB), and modest max-num-batched-tokens to keep activations small.
#
# Endpoint: http://localhost:8021/v1  (model name: qwen3.6-35b-a3b-awq)
# Pinned to GPU 0 — frees GPUs 1-3 for the 27B (TP=2) or other workloads.
# ===========================================================================
services:
  vllm-qwen36-35b-a3b:
    image: vllm/vllm-openai@sha256:9bba4628a3b943e0dd33caefb94b811569ba1e97bdf23bee19a265c31b947ccb
    container_name: vllm-qwen36-35b-a3b
    restart: "no"
    ports:
      - "8021:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        python3 /patches/patch_tolist_cudagraph.py || true
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-35b-a3b-awq-int4
      - --served-model-name
      - qwen3.6-35b-a3b-awq
      - --quantization
      - compressed-tensors
      - --dtype
      - float16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "20480"
      - --gpu-memory-utilization
      - "0.96"
      - --max-num-seqs
      - "1"
      # Mamba block_size constraint: must be >= 1056 (qwen3_5_moe SSM block at 8K ctx).
      - --max-num-batched-tokens
      - "1088"
      - --enforce-eager
      # Vision tower OOMs the 24 GB 3090 even at 16K ctx — text-only here.
      # Use the TP=2 variant for vision.
      - --language-model-only
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --host
      - 0.0.0.0
      - --port
      - "8000"
