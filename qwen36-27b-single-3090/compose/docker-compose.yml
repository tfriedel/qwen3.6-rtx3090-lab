# ===========================================================================
# Default — the config we recommend for general use.
#
# This config PASSES every test in scripts/verify-full.sh:
#   server  genesis  Paris  tool-calls  streaming  thinking  needle-recall
#
# Config: MTP spec-decode n=3 + fp8_e5m2 KV + vision enabled.
#
# Variant matrix (all three compose files in this dir):
#
#   Compose file                               Max ctx   Narr TPS   Code TPS   Tools   Vision   Status
#   docker-compose.yml (this file, default)     20K        66         84         ✅       ✅       validated
#   docker-compose.tools-text.yml                75K        65         84         ✅       ❌       validated
#   docker-compose.longctx-experimental.yml    125K        92         95         ✗        ✅       ⚠ see file
#
# The experimental variant uses TurboQuant KV to fit a 125K KV pool, which
# benchmarks faster but fails on tool calls, long-context recall, and some
# structured-output tasks (degenerate token loops). See the file header of
# docker-compose.longctx-experimental.yml and README § Known issues.
#
# Run with:
#   cd compose
#   docker compose up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    # Pinned to vLLM nightly 2026-05-28 (commit 626fa9bba5663a5cf6a870debf031ee344ddb822).
    # Bumped from 2026-05-07 (commit 51f22dc) to track latest nightly. The Qwen3 tool-call fix
    # (PR #35687, "Treat <tool_call> as implicit reasoning end") that prompted the prior bump
    # is well upstream of this commit. See ../../TOOL_CALLING_ISSUES.md.
    image: vllm/vllm-openai@sha256:674922aae790c2cbf45f4e844098d227b80d40a74bfc7797a444d213a221879f
    container_name: vllm-qwen36-27b
    restart: "no"
    ports:
      - "8020:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface
      # Genesis monolithic patch_genesis_unified.py was removed upstream on 2026-04-24
      # (Sandermage repo migrated to modular genesis_vllm_plugin). Skipping for now —
      # default compose uses fp8_e5m2 KV (NOT turboquant) so the hybrid-gate bypass
      # this patch provides is not strictly required. If startup fails on hybrid
      # attention or tool calls misbehave, mount the new plugin instead.
      # - ../patches/genesis/patch_genesis_unified.py:/patches/patch_genesis_unified.py:ro
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
      - ../patches/templates/qwen3.6-enhanced.jinja:/patches/templates/qwen3.6-enhanced.jinja:ro
    environment:
      # Pinned to GPU 1 (idle). GPU 0 is the desktop GPU (~458 MiB to Xorg/gnome);
      # the 2026-05-28 nightly's higher baseline OOMs by ~86 MiB there loading the
      # MTP drafter. GPUs 1-3 are headless. Change to 0 only if the desktop is off.
      - CUDA_VISIBLE_DEVICES=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        if [ -f /patches/patch_genesis_unified.py ]; then
          python3 /patches/patch_genesis_unified.py
        else
          echo "[entrypoint] patch_genesis_unified.py not mounted — skipping Genesis (file removed upstream 2026-04-24)"
        fi
        python3 /patches/patch_tolist_cudagraph.py
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - --served-model-name
      - qwen3.6-27b-autoround
      - --quantization
      - auto_round
      - --dtype
      - float16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "20000"
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "2048"
      # fp8_e5m2 KV — NOT turboquant — because MTP + turboquant collapses on tool-call prompts.
      - --kv-cache-dtype
      - fp8_e5m2
      - --trust-remote-code
      - --chat-template
      - /patches/templates/qwen3.6-enhanced.jinja
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
