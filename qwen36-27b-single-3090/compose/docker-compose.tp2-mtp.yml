# ===========================================================================
# Qwen3.6-27B (dense) — vLLM AutoRound TP=2 + MTP-4 + prefix-cache OFF
#                        + FULL cudagraphs (FA2) + custom allreduce
#
# The raw-throughput mode. 2026-07-12 recipe (inspired by the HF/Google
# "Gemma Challenge" onegraph lesson — kill kernel-launch overhead in the
# MTP spec-decode loop with full CUDA-graph capture):
#
#   • --attention-backend FLASH_ATTN + fp16 KV (no fp8_e5m2):
#     FlashInfer only supports full cudagraphs for single-token decode, so
#     with MTP enabled vLLM silently downgraded the WHOLE model to PIECEWISE
#     ("...not supported with spec-decode for attention backend
#     FlashInferBackend...; setting cudagraph_mode=PIECEWISE").
#     FA2 (UNIFORM_BATCH) keeps FULL_AND_PIECEWISE alive; full-graph decode
#     alone is ~2x TPS at fixed kernels on launch-bound 3090s (53→111 narr).
#     FA2 can't do fp8 KV → fp16; KV pool 316K tokens, still 3x the 100K ctx.
#     (TRITON_ATTN would allow fp8+FULL but crashes: Dynamo assert in
#     qwen3_next attention.)
#   • PYTORCH_CUDA_ALLOC_CONF without expandable_segments:True —
#     expandable segments break cudaIpcGetMemHandle in vLLM custom allreduce
#     (crash: custom_all_reduce.cuh:455 'invalid argument'; vllm #42609).
#     With it removed, CUSTOM allreduce works over BAR1 P2P: +10% code TPS.
#   • MTP k=4 (was 3): with full graphs + custom AR the verify pass is cheap
#     enough that k=4 wins on code (+8%) and is flat on narrative.
#     k-sweep 2026-07-12: k=3 118/154, k=4 117/166, k=5 114/165 (narr/code).
#   • Image: nightly 2026-07-12 (v0.23.1rc1) — ≈ pinned 05-28 on this path,
#     pinned by digest for reproducibility.
#
# Measured (bench.sh, 2× 3090, P2P driver 610.43.02):
#   narr 116-118 / code 153-171 TPS  — vs 93/119 with the previous recipe
#   (FlashInfer+fp8_e5m2+k3, which ALSO no longer boots: custom-AR crash).
#
# Tradeoff vs `tp2`: prefix caching OFF (vllm #38182) — use tp2 for
# long-system-prompt agentic sessions, tp2-mtp for raw throughput.
#
# Run:
#   ./qwen.sh start tp2-mtp
# ===========================================================================
services:
  vllm-qwen36-27b:
    image: vllm/vllm-openai@sha256:f2ac337893360e23462249c3897e1c92dc8ba8a1ebbc3dd15c4ac931e957438e  # nightly 2026-07-12, v0.23.1rc1
    container_name: vllm-qwen36-27b
    restart: "no"
    ports:
      - "8020:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
      - ../patches/templates/qwen3.6-enhanced.jinja:/patches/templates/qwen3.6-enhanced.jinja:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=0
      - NCCL_P2P_LEVEL=PHB
      - NCCL_IB_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      # expandable_segments:True breaks custom-allreduce IPC (vllm #42609)
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    shm_size: "24gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        python3 /patches/patch_tolist_cudagraph.py || true
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - --served-model-name
      - qwen3.6-27b-autoround
      - --quantization
      - auto_round
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      # FA2 keeps FULL cudagraphs alive with MTP (FlashInfer would force PIECEWISE)
      - --attention-backend
      - FLASH_ATTN
      - --max-model-len
      - "100000"
      - --gpu-memory-utilization
      - "0.93"
      - --max-num-seqs
      - "2"
      # 4096 (vs 4128 in tp2.yml) — matches the MoE tp2-mtp setting and the
      # r/LocalLLaMA single-5090 NVFP4 setup; vLLM warns 4096 may be slightly
      # suboptimal for MTP, but bumping further (8192) produced no gain on the
      # MoE A/B, so keep 4096 to isolate the prefix-cache delta.
      - --max-num-batched-tokens
      - "4096"
      - --trust-remote-code
      - --chat-template
      - /patches/templates/qwen3.6-enhanced.jinja
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # The two flags that differ from tp2.yml:
      #   --no-enable-prefix-caching   (was --enable-prefix-caching)
      #   speculative-config           (already present in tp2.yml — kept identical)
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":4}'
      - --no-enable-prefix-caching
      - --enable-chunked-prefill
      - --host
      - 0.0.0.0
      - --port
      - "8000"
