# ===========================================================================
# 2× RTX 3090 tensor-parallel variant — sweet-spot for decode TPS on consumer
# cards.
#
# Why TP=2 vs TP=4 on this rig:
#   • Decode is bandwidth-bound: every transformer layer all-reduces across
#     all TP ranks. On PCIe-only 3090s (no NVLink, NCCL_P2P_DISABLE=1) the
#     all-reduce hops through host memory.
#   • TP=2 is one round-trip per all-reduce; TP=4 is a tree-reduce with two
#     hops AND four-card contention on the same PCIe fabric.
#   • TP=2 still gives ~2× the per-card KV budget vs single-GPU (since the
#     model shard halves), so context grows substantially without paying the
#     full TP=4 communication tax.
#   • Frees GPUs 2-3 for other work (Open WebUI, embeddings, another model).
#
# Tradeoffs:
#   + Highest decode TPS of all variants on this hardware
#   + Plenty of context (target 100K with vision + tools)
#   + No Genesis required (fp8_e5m2 KV)
#   - Less context than tp4 (which gets 150K+)
#   - Two cards committed
#
# Run with:
#   cd compose
#   docker compose -f docker-compose.tp2.yml up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    image: vllm/vllm-openai@sha256:f2ac337893360e23462249c3897e1c92dc8ba8a1ebbc3dd15c4ac931e957438e  # nightly 2026-07-12, v0.23.1rc1
    container_name: vllm-qwen36-27b
    restart: "no"
    ports:
      - "8020:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/root/.cache/huggingface
      - ../patches/patch_tolist_cudagraph.py:/patches/patch_tolist_cudagraph.py:ro
      - ../patches/templates/qwen3.6-enhanced.jinja:/patches/templates/qwen3.6-enhanced.jinja:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=0
      - NCCL_P2P_LEVEL=PHB
      - NCCL_IB_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_NO_USAGE_STATS=1
      # expandable_segments:True breaks custom-allreduce IPC (vllm #42609) -> boot crash custom_all_reduce.cuh:455
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    shm_size: "24gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        pip install xxhash -q
        python3 /patches/patch_tolist_cudagraph.py || true
        exec vllm serve "$@"
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b-autoround-int4
      - --served-model-name
      - qwen3.6-27b-autoround
      - --quantization
      - auto_round
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      # FA2 keeps FULL cudagraphs alive with MTP (FlashInfer forces PIECEWISE); needs fp16 KV
      - --attention-backend
      - FLASH_ATTN
      - --max-model-len
      - "100000"
      - --gpu-memory-utilization
      - "0.93"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4128"
      - --trust-remote-code
      - --chat-template
      - /patches/templates/qwen3.6-enhanced.jinja
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
